<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D World Map - Meteor Impact Simulator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 50%, #16213e 100%);
            color: white;
        }

        #map { 
            width: 100vw; 
            height: 100vh; 
            display: block; 
        }

        /* Search Box Styling */
        #searchBox {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            padding: 15px 25px;
            width: 400px;
            font-size: 16px;
            border: none;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            color: white;
            outline: none;
            transition: all 0.4s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #searchBox::placeholder {
            color: rgba(255, 255, 255, 0.7);
            font-style: italic;
        }

        #searchBox:focus {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 15px 40px rgba(0, 123, 255, 0.4);
            border-color: #007bff;
            transform: translateX(-50%) translateY(-2px);
        }

        /* Control Panel */
        .controls {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(15px);
            border-radius: 15px;
            padding: 20px;
            min-width: 200px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-label {
            color: #00d4ff;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
            display: block;
        }

        .slider {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.2));
            outline: none;
            /* -webkit-appearance: none; */
            cursor: pointer;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.6);
        }

        .value-display {
            color: white;
            font-size: 12px;
            text-align: center;
            margin-top: 5px;
            background: rgba(0, 212, 255, 0.2);
            padding: 3px 8px;
            border-radius: 10px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <!-- Search Box -->
    <input
        type="text"
        id="searchBox"
        placeholder="🔍 Search for a city..."
        disabled
    />
    
    <!-- Control Panel -->
    <!-- <div class="controls">
        <div class="control-group">
            <label class="control-label" for="meteorSize">Meteor Size</label>
            <input type="range" id="meteorSize" class="slider" min="0.5" max="8" value="2" step="0.5">
            <div class="value-display" id="sizeValue">2.0x</div>
        </div>
    </div> -->
    
    <!-- Main Map Container -->
    <div id="map"></div>

    <!-- Scripts in correct order -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/MapControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

</body>
</html>

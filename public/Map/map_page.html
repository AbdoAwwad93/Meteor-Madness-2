<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D World Map - Meteor Impact Simulator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 50%, #16213e 100%);
            color: white;
        }

        #map { 
            width: 100vw; 
            height: 100vh; 
            display: block; 
        }

        /* Search Box Styling */
        #searchBox {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            padding: 15px 25px;
            width: 400px;
            font-size: 16px;
            border: none;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            color: white;
            outline: none;
            transition: all 0.4s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #searchBox::placeholder {
            color: rgba(255, 255, 255, 0.7);
            font-style: italic;
        }

        #searchBox:focus {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 15px 40px rgba(0, 123, 255, 0.4);
            border-color: #007bff;
            transform: translateX(-50%) translateY(-2px);
        }

        /* Control Panel */
        .controls {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(15px);
            border-radius: 15px;
            padding: 20px;
            min-width: 200px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-label {
            color: #00d4ff;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
            display: block;
        }

        .slider {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.2));
            outline: none;
            /* -webkit-appearance: none; */
            cursor: pointer;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.6);
        }

        .value-display {
            color: white;
            font-size: 12px;
            text-align: center;
            margin-top: 5px;
            background: rgba(0, 212, 255, 0.2);
            padding: 3px 8px;
            border-radius: 10px;
            display: inline-block;
        }

        /* Loading Screen */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 50%, #16213e 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            transition: opacity 0.5s ease-out;
        }

        .loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(0, 212, 255, 0.3);
            border-top: 3px solid #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        .loading-text {
            color: #00d4ff;
            font-size: 18px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 10px;
        }

        .loading-subtext {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            text-align: center;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Back to Earth Button */
        .back-to-earth-btn {
            position: absolute;
            bottom: 20px;
            left: 20px;
            padding: 12px 20px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            z-index: 1000;
            transition: all 0.2s ease;
            backdrop-filter: blur(15px);
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            transform: scale(1);
            opacity: 1;
        }

        .back-to-earth-btn:hover {
            background: rgba(0, 102, 204, 0.2);
            border-color: #0066cc;
            color: #0066cc;
            transform: translateY(-1px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
        }

        .back-to-earth-btn:active {
            transform: translateY(0);
        }

        .back-to-earth-btn .icon {
            font-size: 1rem;
            transition: transform 0.2s ease;
        }

        .back-to-earth-btn:hover .icon {
            transform: translateX(-2px);
        }

        /* Impact Analysis Panel */
        .impact-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            color: white;
            z-index: 1000;
            min-width: 350px;
            max-width: 450px;
            max-height: calc(100vh - 100px);
            overflow-y: auto;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            transform: translateX(-100%);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
        }

        .impact-panel.visible {
            transform: translateX(0);
            opacity: 1;
            pointer-events: auto;
        }

        .impact-header {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }

        .impact-title {
            font-weight: 700;
            color: #ffffff;
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .impact-subtitle {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 400;
        }

        .severity-badge {
            display: inline-block;
            padding: 6px 12px;
            background: #333;
            color: white;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 15px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }

        .stat-label {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
        }

        .section {
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: #00e5ff;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .impact-zone {
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid rgba(255, 0, 0, 0.3);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
        }

        .zone-title {
            color: #ff4757;
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .zone-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 12px;
        }

        .zone-stat {
            display: flex;
            justify-content: space-between;
            color: rgba(255, 255, 255, 0.8);
        }

        .zone-stat .label {
            color: rgba(255, 255, 255, 0.6);
        }

        .zone-stat .value {
            font-weight: 500;
            color: #ff4757;
        }

        .volcanic-info {
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid rgba(0, 255, 136, 0.3);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
        }

        .volcanic-info.affected {
            background: rgba(255, 140, 0, 0.1);
            border: 1px solid rgba(255, 140, 0, 0.3);
        }

        .volcanic-title {
            color: #00ff88;
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .volcanic-info.affected .volcanic-title {
            color: #ff8c00;
        }

        .volcanic-details {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.8);
        }

        .location-info {
            background: rgba(0, 102, 204, 0.1);
            border: 1px solid rgba(0, 102, 204, 0.3);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
        }

        .location-title {
            color: #0066cc;
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .location-details {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.8);
        }

        .close-button {
            position: absolute;
            top: 15px;
            right: 15px;
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            font-size: 20px;
            cursor: pointer;
            padding: 5px;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .close-button:hover {
            color: white;
            background: rgba(255, 255, 255, 0.1);
        }

        .loading-spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #00e5ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .error-message {
            background: rgba(255, 71, 87, 0.1);
            border: 1px solid rgba(255, 71, 87, 0.3);
            border-radius: 8px;
            padding: 12px;
            color: #ff4757;
            font-size: 12px;
            text-align: center;
        }

        /* Enhanced Tab Interface Styles */
        .tab-container {
            width: 100%;
        }

        .tab-buttons {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .tab-btn {
            flex: 1;
            padding: 10px 15px;
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s ease;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .tab-btn.active {
            color: #00e5ff;
            border-bottom-color: #00e5ff;
        }

        .tab-btn:hover {
            color: rgba(255, 255, 255, 0.8);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .section-content {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 15px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.9);
            line-height: 1.6;
        }

        .key-findings {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .finding-item {
            background: rgba(255, 255, 255, 0.05);
            border-left: 3px solid #00e5ff;
            padding: 10px 15px;
            border-radius: 0 6px 6px 0;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.9);
        }

        .comparison-events {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .comparison-item {
            background: rgba(0, 229, 255, 0.1);
            border: 1px solid rgba(0, 229, 255, 0.3);
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 12px;
            color: #00e5ff;
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-spinner"></div>
        <div class="loading-text">Loading Impact Analysis</div>
        <div class="loading-subtext">Preparing 3D visualization...</div>
    </div>

    <!-- Search Box -->
    <input
        type="text"
        id="searchBox"
        placeholder="🔍 Search for a city..."
        disabled
    />
    
    <!-- Control Panel -->
    <!-- <div class="controls">
        <div class="control-group">
            <label class="control-label" for="meteorSize">Meteor Size</label>
            <input type="range" id="meteorSize" class="slider" min="0.5" max="8" value="2" step="0.5">
            <div class="value-display" id="sizeValue">2.0x</div>
        </div>
    </div> -->
    
    <!-- Main Map Container -->
    <div id="map"></div>

    <!-- Impact Analysis Panel -->
    <div class="impact-panel" id="impactPanel">
        <button class="close-button" id="closeImpactPanel">×</button>
        <div class="impact-header">
            <div class="impact-title">Impact Analysis</div>
            <div class="impact-subtitle" id="impactSubtitle">Calculating impact data...</div>
        </div>
        <div id="impactContent">
            <div class="loading-spinner">
                <div class="spinner"></div>
            </div>
        </div>
    </div>

    <!-- Back to Earth Button -->
    <button class="back-to-earth-btn" id="backToEarthBtn">
        <span class="icon">←</span>
        Back to Earth
    </button>

    <!-- Scripts in correct order -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/MapControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

    <script src="js/map.js?v=2.0"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D World Map - Meteor Impact Simulator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 50%, #16213e 100%);
            color: white;
        }

        #map { 
            width: 100vw; 
            height: 100vh; 
            display: block; 
        }

        /* Search Box Styling */
        #searchBox {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            padding: 15px 25px;
            width: 400px;
            font-size: 16px;
            border: none;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            color: white;
            outline: none;
            transition: all 0.4s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #searchBox::placeholder {
            color: rgba(255, 255, 255, 0.7);
            font-style: italic;
        }

        #searchBox:focus {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 15px 40px rgba(0, 123, 255, 0.4);
            border-color: #007bff;
            transform: translateX(-50%) translateY(-2px);
        }

        /* Control Panel */
        .controls {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(15px);
            border-radius: 15px;
            padding: 20px;
            min-width: 200px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-label {
            color: #00d4ff;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
            display: block;
        }

        .slider {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.2));
            outline: none;
            /* -webkit-appearance: none; */
            cursor: pointer;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.6);
        }

        .value-display {
            color: white;
            font-size: 12px;
            text-align: center;
            margin-top: 5px;
            background: rgba(0, 212, 255, 0.2);
            padding: 3px 8px;
            border-radius: 10px;
            display: inline-block;
        }

        /* Loading Screen */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 50%, #16213e 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            transition: opacity 0.5s ease-out;
        }

        .loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(0, 212, 255, 0.3);
            border-top: 3px solid #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        .loading-text {
            color: #00d4ff;
            font-size: 18px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 10px;
        }

        .loading-subtext {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            text-align: center;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Back to Earth Button */
        .back-to-earth-btn {
            position: absolute;
            bottom: 20px;
            left: 20px;
            padding: 12px 20px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            z-index: 1000;
            transition: all 0.2s ease;
            backdrop-filter: blur(15px);
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            transform: scale(1);
            opacity: 1;
        }

        .back-to-earth-btn:hover {
            background: rgba(0, 102, 204, 0.2);
            border-color: #0066cc;
            color: #0066cc;
            transform: translateY(-1px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
        }

        .back-to-earth-btn:active {
            transform: translateY(0);
        }

        .back-to-earth-btn .icon {
            font-size: 1rem;
            transition: transform 0.2s ease;
        }

        .back-to-earth-btn:hover .icon {
            transform: translateX(-2px);
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-spinner"></div>
        <div class="loading-text">Loading Impact Analysis</div>
        <div class="loading-subtext">Preparing 3D visualization...</div>
    </div>

    <!-- Search Box -->
    <input
        type="text"
        id="searchBox"
        placeholder="🔍 Search for a city..."
        disabled
    />
    
    <!-- Control Panel -->
    <!-- <div class="controls">
        <div class="control-group">
            <label class="control-label" for="meteorSize">Meteor Size</label>
            <input type="range" id="meteorSize" class="slider" min="0.5" max="8" value="2" step="0.5">
            <div class="value-display" id="sizeValue">2.0x</div>
        </div>
    </div> -->
    
    <!-- Main Map Container -->
    <div id="map"></div>

    <!-- Back to Earth Button -->
    <button class="back-to-earth-btn" id="backToEarthBtn">
        <span class="icon">←</span>
        Back to Earth
    </button>

    <!-- Scripts in correct order -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/MapControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NASA Eyes on Earth - Test</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        
        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 8px;
            max-width: 300px;
        }
        
        h1 {
            color: #4ecdc4;
            margin-top: 0;
        }
        
        .status {
            margin: 10px 0;
            padding: 10px;
            background: rgba(78, 205, 196, 0.1);
            border: 1px solid rgba(78, 205, 196, 0.3);
            border-radius: 4px;
        }
        
        .error {
            background: rgba(235, 77, 75, 0.1);
            border-color: rgba(235, 77, 75, 0.3);
        }
        
        .success {
            background: rgba(46, 213, 115, 0.1);
            border-color: rgba(46, 213, 115, 0.3);
        }
        
        #canvas {
            display: block;
        }
        
        .instructions {
            margin-top: 15px;
            font-size: 0.9em;
            line-height: 1.4;
        }
        
        .instructions ul {
            margin: 10px 0;
            padding-left: 20px;
        }
        
        .instructions li {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="info">
            <h1>NASA Eyes on Earth</h1>
            <div id="status" class="status">
                Initializing test environment...
            </div>
            
            <div class="instructions">
                <h3>Test Instructions:</h3>
                <ul>
                    <li>This is a basic test of the 3D environment</li>
                    <li>The full application requires Node.js and npm</li>
                    <li>Run <code>setup.bat</code> to install dependencies</li>
                    <li>Run <code>npm start</code> to launch the full app</li>
                </ul>
                
                <h3>Requirements Check:</h3>
                <div id="requirements"></div>
            </div>
        </div>
        
        <canvas id="canvas"></canvas>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r158/three.min.js"></script>
    <script>
        const statusEl = document.getElementById('status');
        const requirementsEl = document.getElementById('requirements');
        
        function updateStatus(message, type = 'status') {
            statusEl.textContent = message;
            statusEl.className = `status ${type}`;
        }
        
        function checkRequirements() {
            const checks = [];
            
            // Check WebGL support
            const canvas = document.createElement('canvas');
            const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
            checks.push({
                name: 'WebGL Support',
                passed: !!gl,
                message: gl ? 'WebGL is supported' : 'WebGL is not supported'
            });
            
            // Check Three.js
            checks.push({
                name: 'Three.js Library',
                passed: typeof THREE !== 'undefined',
                message: typeof THREE !== 'undefined' ? 'Three.js loaded successfully' : 'Three.js failed to load'
            });
            
            // Display results
            requirementsEl.innerHTML = checks.map(check => 
                `<div class="status ${check.passed ? 'success' : 'error'}">
                    ${check.name}: ${check.message}
                </div>`
            ).join('');
            
            return checks.every(check => check.passed);
        }
        
        function initTest() {
            if (!checkRequirements()) {
                updateStatus('Requirements check failed', 'error');
                return;
            }
            
            updateStatus('Creating 3D scene...', 'status');
            
            try {
                // Basic Three.js setup
                const scene = new THREE.Scene();
                const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100000);
                const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas'), antialias: true });
                
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setClearColor(0x000000);
                
                // Create Earth
                const earthGeometry = new THREE.SphereGeometry(6371, 32, 16);
                const earthMaterial = new THREE.MeshPhongMaterial({ 
                    color: 0x4a90e2,
                    shininess: 100 
                });
                const earth = new THREE.Mesh(earthGeometry, earthMaterial);
                scene.add(earth);
                
                // Create atmosphere
                const atmosphereGeometry = new THREE.SphereGeometry(6371 * 1.01, 16, 8);
                const atmosphereMaterial = new THREE.MeshBasicMaterial({ 
                    color: 0x87ceeb,
                    transparent: true,
                    opacity: 0.1,
                    side: THREE.BackSide
                });
                const atmosphere = new THREE.Mesh(atmosphereGeometry, atmosphereMaterial);
                scene.add(atmosphere);
                
                // Create test satellite
                const satelliteGeometry = new THREE.BoxGeometry(100, 50, 50);
                const satelliteMaterial = new THREE.MeshBasicMaterial({ color: 0xff6b6b });
                const satellite = new THREE.Mesh(satelliteGeometry, satelliteMaterial);
                satellite.position.set(8000, 0, 0);
                scene.add(satellite);
                
                // Add lighting
                const ambientLight = new THREE.AmbientLight(0x404040, 0.2);
                scene.add(ambientLight);
                
                const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
                directionalLight.position.set(10000, 0, 5000);
                scene.add(directionalLight);
                
                // Position camera
                camera.position.set(0, 0, 15000);
                camera.lookAt(0, 0, 0);
                
                // Animation loop
                function animate() {
                    requestAnimationFrame(animate);
                    
                    // Rotate Earth
                    earth.rotation.y += 0.005;
                    
                    // Orbit satellite
                    const time = Date.now() * 0.0005;
                    satellite.position.x = Math.cos(time) * 8000;
                    satellite.position.z = Math.sin(time) * 8000;
                    
                    renderer.render(scene, camera);
                }
                
                // Handle window resize
                window.addEventListener('resize', () => {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                });
                
                // Start animation
                animate();
                updateStatus('3D test environment running successfully!', 'success');
                
            } catch (error) {
                console.error('Test initialization failed:', error);
                updateStatus(`Test failed: ${error.message}`, 'error');
            }
        }
        
        // Initialize when page loads
        window.addEventListener('load', initTest);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no"/>
  <meta name="theme-color" content="#000000" />
  <title>Meteor Madness - Asteroid Explorer</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style/asteriod_game_style.css">
</head>
<body>
  <!-- شاشة اختيار النيزك -->
  <div id="asteroidSelection" class="selection-screen">
    <div class="selection-container">
      <h1>Choose Your Asteroid</h1>
      <div class="asteroid-viewer">
        <button class="nav-btn left-btn" id="prevAsteroid">◀</button>
        <div id="asteroidPreview"></div>
        <button class="nav-btn right-btn" id="nextAsteroid">▶</button>
      </div>
      <div class="asteroid-info">
        <h2 id="asteroidName">Iron Asteroid</h2>
      </div>
      <div class="size-selector">
        <label>Asteroid Size:</label>
        <input type="range" id="sizeSlider" min="1" max="5" value="1" step="0.5">
        <span id="sizeValue">1x</span>
      </div>
      <button id="launchBtn" class="launch-btn">LAUNCH SIMULATION</button>
    </div>
  </div>

  <!-- الشاشة الرئيسية -->
  <div id="mainScreen" style="display: none;">
    <canvas id="gameCanvas" style="position: fixed; top: 0; left: 0; z-index: 1; width: 100vw; height: 100vh;"></canvas>
    <div class="search-container">
      <input type="text" id="search" placeholder="Search for a city...">
      <button id="searchBtn">Search</button>
      <div id="searchResults" class="search-results" style="display: none;">
        <!-- Search results will be populated here -->
      </div>
    </div>
    <button id="asteroidBtn">Launch Asteroid</button>
    <button id="changeAsteroidBtn">Change Asteroid</button>
    
    <!-- قائمة اختيار نوع الدفاع -->
    <div id="defenseMenu" class="defense-menu">
      <h3>Defense System</h3>
      <div class="defense-options">
        <!-- <div class="defense-option" data-defense="blast">
          <div class="defense-icon">🛰️</div>
          <p>kinetic Impactor</p>
          <span class="defense-desc">Kinetic Option</span>
        </div> -->
        <div class="defense-option" data-defense="kinetic">
          <div class="defense-icon">🚀</div>
          <p>Blast Deflection</p>
          <span class="defense-desc">Direct Impact</span>
        </div>
        <div class="defense-option selected" data-defense="none">
          <div class="defense-icon">🌍</div>
          <p>No Defense</p>
          <span class="defense-desc">Direct Hit</span>
        </div>
      </div>
    </div>

    <!-- منيو تغيير النيزك -->
    <div id="asteroidMenu" class="asteroid-menu" style="display: none;">
      <div class="menu-content">
        <h3>Select New Asteroid</h3>
        <div class="asteroid-options">
          <div class="asteroid-option" data-index="0">
            <div class="option-preview" id="option-0"></div>
            <p>Iron Asteroid</p>
          </div>
          <div class="asteroid-option" data-index="1">
            <div class="option-preview" id="option-1"></div>
            <p>Rocky Asteroid</p>
          </div>
          <div class="asteroid-option" data-index="2">
            <div class="option-preview" id="option-2"></div>
            <p>Carbon Asteroid</p>
          </div>
          <div class="asteroid-option" data-index="3">
            <div class="option-preview" id="option-3"></div>
            <p>Ice Asteroid</p>
          </div>
        </div>
        <div class="size-selector-menu">
          <label>Size:</label>
          <input type="range" id="sizeSliderMenu" min="1" max="5" value="1" step="0.5">
          <span id="sizeValueMenu">1x</span>
        </div>
        <div class="menu-buttons">
          <button id="confirmAsteroid" class="confirm-btn">Confirm</button>
          <button id="cancelAsteroid" class="cancel-btn">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="../js/cityService.js"></script>
  <script src="../js/asteriod_game.js"></script>
</body>
</html>
